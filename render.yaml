services:
    - type: web
      name: public-folder-downloader
      plan: free
      runtime: python
      rootDir: backend
      buildCommand: pip install -r requirements.txt
      startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
      healthCheckPath: /health
      envVars:
          - key: ALLOWED_ORIGINS
            sync: false
          - key: MAX_CONCURRENT_DOWNLOADS
            value: "2"
          - key: MAX_FILES
            value: "1000"
          - key: MAX_DOWNLOAD_MB
            value: "1024"
